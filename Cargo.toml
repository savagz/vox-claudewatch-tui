[package]
name = "voxclaudewatch-tui"
version = "1.0.0"
edition = "2024"
# let-chains (edición 2024) y ratatui 0.30 piden 1.88.
rust-version = "1.88"
description = "TUI que muestra en vivo la actividad de Claude Code recibida del mod activity-beacon"
repository = "https://github.com/savagz/vox-claudewatch-tui"

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "io-util", "net"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
directories = "5"
chrono = "0.4"

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
